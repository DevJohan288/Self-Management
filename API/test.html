<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login con API</title>
</head>

<body>
    <h2>Login con API (Prueba)</h2>
    <form id="loginForm">
        <label for="correo">Correo:</label><br>
        <input type="email" name="correo" required><br>

        <label for="password">Contraseña:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Iniciar sesión</button>
    </form>

    <p id="error" style="color:red;"></p>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const correo = this.correo.value;
            const password = this.password.value;

            fetch('http://localhost/Self-Management/API/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, password })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.user && data.user.rol) {
                        // Redirigir según rol
                        if (data.user.rol == 1) {
                            window.location.href = '/Self-Management/app/views/admin/admin_home.php';
                        } else {
                            window.location.href = '/Self-Management/app/views/client/client_home.php';
                        }
                    } else if (data.error) {
                        document.getElementById('error').textContent = data.error;
                    } else {
                        document.getElementById('error').textContent = "Respuesta inesperada del servidor.";
                    }
                })
                .catch(err => {
                    document.getElementById('error').textContent = "Error al conectar con el servidor.";
                    console.error(err);
                });
        });
    </script>
</body>

</html>
